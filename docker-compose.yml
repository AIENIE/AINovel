services:
  backend:
    container_name: ainovel-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"
    ports:
      - "${BACKEND_PORT:-11041}:11041"
    entrypoint: ["sh", "-c", ". /app/bin/load-env-file.sh /app/env.txt && exec java $${JAVA_OPTS:-} -jar /app/app.jar"]
    volumes:
      - ./env.txt:/app/env.txt:ro
      - ./docker/load-env-file.sh:/app/bin/load-env-file.sh:ro
      - ${APP_LOG_DIR_HOST:-/home/duwei/aienie-runtime/observability/data/ainovel/logs}:/app/logs
      - ${APP_RECORD_DIR_HOST:-/home/duwei/aienie-runtime/observability/data/ainovel/records}:/app/records
    extra_hosts:
      - "localbase.testhut.top:${LOCALBASE_HOST_IP:-172.20.0.2}"
      - "localuserservice.testhut.top:host-gateway"
      - "localpayservice.testhut.top:host-gateway"
      - "localaiservice.testhut.top:host-gateway"
    networks:
      - ainovel

  frontend:
    container_name: ainovel-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-5}"
    ports:
      - "${FRONTEND_PORT:-11040}:11040"
    networks:
      - ainovel

networks:
  ainovel:
    driver: bridge
