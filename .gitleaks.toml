title = "AINovel secret scanning policy"

[extend]
useDefault = true

[[allowlists]]
description = "Deterministic test-only JWT and HMAC fixtures"
targetRules = ["generic-api-key", "jwt"]
condition = "AND"
regexTarget = "line"
paths = [
  '''backend/src/test/resources/application\.yml$''',
  '''backend/src/test/java/com/ainovel/app/security/JwtAuthFilterTest\.java$''',
  '''frontend/src/lib/client-error-reporting\.test\.ts$''',
]
regexes = [
  '''secret: 5bb2415cef5fc4d24e30609eece8515e8f2a9f6c4f6df6f9f70b8be85d9a0e11''',
  '''eyJhbGciOiJub25lIn0\.eyJzdWIiOiJmb3JnZWQtYWRtaW4iLCJyb2xlIjoiQURNSU4iLCJ1aWQiOjE4LCJzaWQiOiJzaWQtMDAxIn0\.''',
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiJhZG1pbiJ9\.signature123''',
]
