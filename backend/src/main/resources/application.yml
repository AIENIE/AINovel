spring:
  mvc:
    servlet:
      path: /api
  datasource:
    url: ''
    username: ainovel
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
      connection-timeout: 5000
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-version: 1
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
  data:
    redis:
      host: ''
      port: 26379
      username: ''
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: false
      timeout: 3s
  cache:
    type: redis
    redis:
      key-prefix: 'aienie:ainovel:'
      use-key-prefix: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    time-zone: Asia/Shanghai
server:
  port: 11041
logging:
  file:
    name: ./logs/ainovel.log
  structured:
    format:
      file: ecs
  pattern:
    level: requestId=%X{requestId:-none} %5p
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 1GB
      clean-history-on-start: true
  level:
    root: INFO
    com.ainovel: INFO
management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,userService
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    enable:
      all: false
      application.started.time: true
      application.ready.time: true
      process.start.time: true
      process.uptime: true
      http.server.requests: true
    tags:
      component: ai-novel
      service: backend
      environment: develop
      release_id: unknown
      release_version: unknown
app:
  time-zone: Asia/Shanghai
  records:
    dir: ./var/records
    max-file-size-bytes: 10485760
    max-history-days: 14
    max-total-size-bytes: 1073741824
  admin-auth:
    username: ''
    password-hash: ${ADMIN_PASSWORD_HASH:}
    encryption-keys: ${ADMIN_TOTP_ENCRYPTION_KEYS:}
    active-key-version: ''
    trusted-origins: ''
    cookie-secure: true
    session-minutes: 30
    session-idle-minutes: 10
    recovery-session-minutes: 15
    recovery-session-idle-minutes: 10
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 120
    issuer: ainovel
    audience: ainovel-web
  ai:
    admission:
      max-messages: 64
      max-message-chars: 20000
      max-total-chars: 100000
      max-requests-per-minute: 20
      max-user-in-flight: 2
      max-global-in-flight: 32
      reservation-credits: 2
  external:
    project-key: ainovel
    ai-timeout-ms: 60000
    billing-timeout-ms: 5000
    grpc:
      tls-enabled: true
      plaintext-enabled: false
      trust-cert-collection: ''
    security:
      fail-fast: true
      ai:
        hmac-caller: ''
        hmac-secret: ${GRPC_SHARED_SECRET}
      user:
        caller-id: ainovel
        issuer: ainovel
        secret: ${GRPC_SHARED_SECRET}
        audience: aienie-userservice-grpc
        ttl-seconds: 300
        scopes: user.auth.session.read
      pay:
        caller-id: ainovel
        issuer: ainovel
        service-name: ainovel
        secret: ${GRPC_SHARED_SECRET}
        audience: aienie-payservice-grpc
        role: SERVICE
        ttl-seconds: 300
        scopes: billing.balance.read,billing.balance.convert,billing.grant.write,billing.usage.deduct,billing.redeem.write,billing.ledger.read
    userservice-http:
      address: https://userservice.seekerhut.com
    aiservice-grpc:
      address: static://aiservice.seekerhut.com:443
    payservice-grpc:
      address: static://payservice.seekerhut.com:443
sso:
  callback-origin: ''
  session-validation:
    enabled: true
    timeout-ms: ${runtime.configuration.USER_SESSION_GRPC_TIMEOUT_MS:${USER_SESSION_GRPC_TIMEOUT_MS:${app.external.session-timeout-ms:${runtime.configuration.EXTERNAL_SESSION_TIMEOUT_MS:${EXTERNAL_SESSION_TIMEOUT_MS:5000}}}}}
    grpc-address: static://userservice.seekerhut.com:443
qdrant:
  host: ''
  http-port: 26333
  enabled: true
  api-key: ${QDRANT_API_KEY:}
  connect-timeout-ms: 2000
  request-timeout-ms: 5000
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
runtime:
  configuration:
    ENV: ''
    AUTH_MODE: ''
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:}
    ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:}
ENV: ${runtime.configuration.ENV}
AUTH_MODE: ${runtime.configuration.AUTH_MODE}
