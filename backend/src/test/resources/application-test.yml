spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: null
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  sql:
    init:
      mode: embedded
      schema-locations: classpath:material-evidence-h2.sql
  data:
    redis:
      host: 127.0.0.1
app:
  material:
    duplicates:
      dispatch-enabled: false
  admin-auth:
    username: admin
    password-hash: $2a$10$dEnQNJUtxcEVsri32i2KmuRrrOBNtvoyn8j1HBUHpRRBjB14bNUgq
    encryption-keys: v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    active-key-version: v1
    trusted-origins: https://localainovel.testhut.top
    session-minutes: 30
    session-idle-minutes: 10
    recovery-session-minutes: 15
    recovery-session-idle-minutes: 10
  external:
    grpc:
      tls-enabled: true
      plaintext-enabled: false
    security:
      ai:
        hmac-caller: ai-novel
        hmac-secret: 0123456789abcdefABCDEFGHIJKLMNOPQRSTUVWXYZuvwxyz
      user:
        caller-id: ainovel
        issuer: ainovel
        secret: 0123456789abcdefABCDEFGHIJKLMNOPQRSTUVWXYZuvwxyz
        audience: aienie-userservice-grpc
        ttl-seconds: 300
        scopes: user.auth.session.read
      pay:
        caller-id: ainovel
        issuer: ainovel
        service-name: ainovel
        secret: 0123456789abcdefABCDEFGHIJKLMNOPQRSTUVWXYZuvwxyz
        audience: aienie-payservice-grpc
        role: SERVICE
        ttl-seconds: 300
        scopes: billing.balance.read,billing.balance.convert,billing.grant.write,billing.usage.deduct,billing.redeem.write,billing.ledger.read
        legacy-static-token: ''
GRPC_SHARED_SECRET: 0123456789abcdefABCDEFGHIJKLMNOPQRSTUVWXYZuvwxyz
