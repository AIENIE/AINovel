spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: 127.0.0.1

app:
  admin-auth:
    username: admin
    password: test-admin-password
    encryption-keys: v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    active-key-version: v1
    session-minutes: 120
    session-idle-minutes: 30
    recovery-session-minutes: 15
    recovery-session-idle-minutes: 10
